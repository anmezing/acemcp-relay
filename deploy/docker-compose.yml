services:
  lce:
    build: ../../lce
    container_name: lce
    restart: unless-stopped
    volumes:
      - lce_data:/data
    environment:
      LCE_HOME: /data
      # 与 relay 共享的租户断言密钥。LCE 以 --host 0.0.0.0 启动（relay 要跨容器访问），
      # 属于"远程调用方"，不配这个密钥时 LCE 会把所有租户工具下架——因为此时它无法
      # 验证 tenant_id 的真伪，而 tenant_id 只是一个普通工具入参。
      LCE_TENANT_ASSERTION_SECRET: ${LCE_TENANT_ASSERTION_SECRET:?set LCE_TENANT_ASSERTION_SECRET in .env (>=32 chars, shared with relay)}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
    healthcheck:
      # 存活端点：不建 session、不占并发额度。
      # 旧的探测发的是完整 initialize，每 30 秒占掉一个 session 名额，而 session 只在
      # 空闲 10 分钟后回收——稳态下约 20 个 > maxSessions 默认 16，探测最终会被 503
      # 挡住并把一个健康的容器标成 unhealthy。
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/mcp/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    build: ../
    container_name: relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lce:
        condition: service_healthy
    environment:
      SERVER_ADDR: "0.0.0.0:3009"
      LCE_MCP_URL: http://lce:3000/mcp
      # 必须与 lce 服务里的值一致：relay 用它签发租户断言，LCE 用它校验。
      LCE_TENANT_ASSERTION_SECRET: ${LCE_TENANT_ASSERTION_SECRET:?set LCE_TENANT_ASSERTION_SECRET in .env (>=32 chars, shared with lce)}
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-acemcp}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-acemcp_relay}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      API_KEY_CACHE_TTL: ${API_KEY_CACHE_TTL:-30m}
      DEVICE_BINDING_MODE: ${DEVICE_BINDING_MODE:-log}
      DEVICE_CACHE_TTL: ${DEVICE_CACHE_TTL:-5m}
      DEVICE_IP_WINDOW: ${DEVICE_IP_WINDOW:-10m}
      DEVICE_MAX_IPS: ${DEVICE_MAX_IPS:-3}
      CONSOLE_API_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      DEFAULT_DAILY_REQUEST_LIMIT: ${DEFAULT_DAILY_REQUEST_LIMIT:-0}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:-}

  frontend:
    build: ../../acemcp-relay-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3001"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://513689.xyz}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      AUTH_LINUXDO_ID: ${AUTH_LINUXDO_ID:-}
      AUTH_LINUXDO_SECRET: ${AUTH_LINUXDO_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GITHUB_MIN_ACCOUNT_AGE_DAYS: ${AUTH_GITHUB_MIN_ACCOUNT_AGE_DAYS:-365}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-acemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acemcp_relay}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-1}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEFAULT_DAILY_REQUEST_LIMIT: ${DEFAULT_DAILY_REQUEST_LIMIT:-0}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:-}

volumes:
  lce_data:

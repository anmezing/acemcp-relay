services:
  lce:
    build: ${DEPLOY_LCE_DIR:-../../lce}
    container_name: lce
    restart: unless-stopped
    volumes:
      - lce_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LCE_HOME: /data
      LCE_CLOUD_DATABASE_URL: ${LCE_CLOUD_DATABASE_URL:?set a PostgreSQL URL whose server has pgvector installed}
      LCE_TENANT_ASSERTION_SECRET: ${LCE_TENANT_ASSERTION_SECRET:?set LCE_TENANT_ASSERTION_SECRET in .env (>=32 chars, shared with relay)}
      LCE_PROVIDER_AUTH_COOLDOWN_MS: ${LCE_PROVIDER_AUTH_COOLDOWN_MS:-300000}
      LCE_PROVIDER_BILLING_COOLDOWN_MS: ${LCE_PROVIDER_BILLING_COOLDOWN_MS:-900000}
      LCE_PROVIDER_TRANSIENT_COOLDOWN_MS: ${LCE_PROVIDER_TRANSIENT_COOLDOWN_MS:-5000}
      LCE_PROVIDER_RATE_LIMIT_MIN_COOLDOWN_MS: ${LCE_PROVIDER_RATE_LIMIT_MIN_COOLDOWN_MS:-1000}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_API_KEYS: ${EMBEDDINGS_API_KEYS:-}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-1024}
      EMBEDDINGS_OUTPUT_DIMENSION: ${EMBEDDINGS_OUTPUT_DIMENSION:-}
      EMBEDDINGS_OUTPUT_DTYPE: ${EMBEDDINGS_OUTPUT_DTYPE:-}
      EMBEDDINGS_NETWORK_MAX_RETRIES: ${EMBEDDINGS_NETWORK_MAX_RETRIES:-3}
      EMBEDDINGS_RATE_LIMIT_MAX_RETRIES: ${EMBEDDINGS_RATE_LIMIT_MAX_RETRIES:-5}
      EMBEDDINGS_RETRY_INITIAL_DELAY_MS: ${EMBEDDINGS_RETRY_INITIAL_DELAY_MS:-1000}
      EMBEDDINGS_RATE_LIMIT_MIN_BACKOFF_MS: ${EMBEDDINGS_RATE_LIMIT_MIN_BACKOFF_MS:-5000}
      EMBEDDINGS_RATE_LIMIT_MAX_BACKOFF_MS: ${EMBEDDINGS_RATE_LIMIT_MAX_BACKOFF_MS:-60000}
      EMBEDDINGS_RATE_LIMIT_SUCCESS_INCREASE_COUNT: ${EMBEDDINGS_RATE_LIMIT_SUCCESS_INCREASE_COUNT:-3}
      EMBEDDINGS_RATE_LIMIT_BACKOFF_DECAY_SUCCESSES: ${EMBEDDINGS_RATE_LIMIT_BACKOFF_DECAY_SUCCESSES:-10}
      EMBEDDINGS_RATE_LIMIT_SLOT_POLL_MS: ${EMBEDDINGS_RATE_LIMIT_SLOT_POLL_MS:-50}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_API_KEYS: ${RERANK_API_KEYS:-}
      RERANK_MAX_ATTEMPTS: ${RERANK_MAX_ATTEMPTS:-3}
      RERANK_RETRY_MAX_DELAY_MS: ${RERANK_RETRY_MAX_DELAY_MS:-10000}
      RERANK_RATE_LIMIT_RETRY_BASE_MS: ${RERANK_RATE_LIMIT_RETRY_BASE_MS:-1000}
      RERANK_TRANSIENT_RETRY_BASE_MS: ${RERANK_TRANSIENT_RETRY_BASE_MS:-500}
      QUERY_REWRITE_API_KEY: ${QUERY_REWRITE_API_KEY:-}
      QUERY_REWRITE_BASE_URL: ${QUERY_REWRITE_BASE_URL:-}
      QUERY_REWRITE_MODEL: ${QUERY_REWRITE_MODEL:-}
      QUERY_REWRITE_MAX_QUERIES: ${QUERY_REWRITE_MAX_QUERIES:-3}
      QUERY_REWRITE_TIMEOUT_MS: ${QUERY_REWRITE_TIMEOUT_MS:-4000}
      QUERY_REWRITE_CACHE_MAX_ENTRIES: ${QUERY_REWRITE_CACHE_MAX_ENTRIES:-256}
      PROMPT_ENHANCER_ENABLED: ${PROMPT_ENHANCER_ENABLED:-false}
      PROMPT_ENHANCER_PROVIDER: ${PROMPT_ENHANCER_PROVIDER:-openai-compatible}
      PROMPT_ENHANCER_MODEL: ${PROMPT_ENHANCER_MODEL:-}
      PROMPT_ENHANCER_BASE_URL: ${PROMPT_ENHANCER_BASE_URL:-}
      PROMPT_ENHANCER_API_KEY: ${PROMPT_ENHANCER_API_KEY:-}
      PROMPT_ENHANCER_API_KEYS: ${PROMPT_ENHANCER_API_KEYS:-}
      PROMPT_ENHANCER_TIMEOUT_MS: ${PROMPT_ENHANCER_TIMEOUT_MS:-30000}
      PROMPT_ENHANCER_MAX_CONCURRENT_REQUESTS: ${PROMPT_ENHANCER_MAX_CONCURRENT_REQUESTS:-4}
      PROMPT_ENHANCER_MAX_RESPONSE_BYTES: ${PROMPT_ENHANCER_MAX_RESPONSE_BYTES:-524288}
      PROMPT_ENHANCER_MAX_OUTPUT_TOKENS: ${PROMPT_ENHANCER_MAX_OUTPUT_TOKENS:-1200}
      PROMPT_ENHANCER_MAX_ATTEMPTS_PER_KEY: ${PROMPT_ENHANCER_MAX_ATTEMPTS_PER_KEY:-2}
      PROMPT_ENHANCER_RETRY_MIN_DELAY_MS: ${PROMPT_ENHANCER_RETRY_MIN_DELAY_MS:-250}
      PROMPT_ENHANCER_RETRY_DEFAULT_DELAY_MS: ${PROMPT_ENHANCER_RETRY_DEFAULT_DELAY_MS:-500}
      PROMPT_ENHANCER_RETRY_MAX_DELAY_MS: ${PROMPT_ENHANCER_RETRY_MAX_DELAY_MS:-2000}
      LCE_HTTP_MAX_CONCURRENT_REQUESTS: ${LCE_HTTP_MAX_CONCURRENT_REQUESTS:-16}
      LCE_HTTP_MAX_SESSIONS: ${LCE_HTTP_MAX_SESSIONS:-16}
      LCE_CLOUD_DB_POOL_MAX: ${LCE_CLOUD_DB_POOL_MAX:-16}
      LCE_CLOUD_DB_QUERY_POOL_MAX: ${LCE_CLOUD_DB_QUERY_POOL_MAX:-}
      LCE_PLATFORM_MODEL_CONFIG_VALIDATION_TIMEOUT_MS: ${LCE_PLATFORM_MODEL_CONFIG_VALIDATION_TIMEOUT_MS:-30000}
      LCE_PLATFORM_MODEL_CONFIG_LOCK_TIMEOUT_MS: ${LCE_PLATFORM_MODEL_CONFIG_LOCK_TIMEOUT_MS:-10000}
      LCE_PLATFORM_MODEL_CONFIG_STATEMENT_TIMEOUT_MS: ${LCE_PLATFORM_MODEL_CONFIG_STATEMENT_TIMEOUT_MS:-50000}
      LCE_PLATFORM_MODEL_VALIDATION_TICKET_TTL_MS: ${LCE_PLATFORM_MODEL_VALIDATION_TICKET_TTL_MS:-600000}
      LCE_PLATFORM_MODEL_PROVIDER_RESPONSE_MAX_BYTES: ${LCE_PLATFORM_MODEL_PROVIDER_RESPONSE_MAX_BYTES:-1048576}
      LCE_PLATFORM_MODEL_DISCOVERY_TIMEOUT_MS: ${LCE_PLATFORM_MODEL_DISCOVERY_TIMEOUT_MS:-10000}
      LCE_PLATFORM_MODEL_DISCOVERY_RESULT_LIMIT: ${LCE_PLATFORM_MODEL_DISCOVERY_RESULT_LIMIT:-500}
      LCE_CLOUD_INDEX_JOB_TTL_MINUTES: ${LCE_CLOUD_INDEX_JOB_TTL_MINUTES:-15}
      LCE_CLOUD_COMPILER_SNAPSHOT_MAX_FILES: ${LCE_CLOUD_COMPILER_SNAPSHOT_MAX_FILES:-2000}
      LCE_CLOUD_QUERY_EMBEDDING_CACHE_TTL_MS: ${LCE_CLOUD_QUERY_EMBEDDING_CACHE_TTL_MS:-30000}
      LCE_CLOUD_QUERY_EMBEDDING_CACHE_MAX_ENTRIES: ${LCE_CLOUD_QUERY_EMBEDDING_CACHE_MAX_ENTRIES:-512}
      LCE_CLOUD_RERANK_CACHE_TTL_MS: ${LCE_CLOUD_RERANK_CACHE_TTL_MS:-30000}
      LCE_CLOUD_RERANK_CACHE_MAX_ENTRIES: ${LCE_CLOUD_RERANK_CACHE_MAX_ENTRIES:-512}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/mcp/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    build: ${DEPLOY_RELAY_DIR:-../}
    container_name: relay
    restart: unless-stopped
    ports:
      - "${RELAY_HOST_BIND_ADDRESS:-127.0.0.1}:${RELAY_HOST_PORT:-3009}:3009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lce:
        condition: service_healthy
    environment:
      GIN_MODE: release
      SERVER_ADDR: "${RELAY_CONTAINER_LISTEN_ADDR:-0.0.0.0:3009}"
      PPROF_ADDR: ${PPROF_ADDR:-127.0.0.1:6060}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LCE_MCP_URL: ${RELAY_LCE_MCP_URL:-http://lce:3000/mcp}
      LCE_TENANT_ASSERTION_SECRET: ${LCE_TENANT_ASSERTION_SECRET:?set LCE_TENANT_ASSERTION_SECRET in .env (>=32 chars, shared with lce)}
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-acemcp}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-acemcp_relay}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-}
      CONSOLE_API_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BANNED_CACHE_TTL: ${BANNED_CACHE_TTL:-5m}
      DEFAULT_DAILY_REQUEST_LIMIT: ${DEFAULT_DAILY_REQUEST_LIMIT:-0}
      DAILY_INDEX_BYTES_LIMIT: ${DAILY_INDEX_BYTES_LIMIT:-2147483648}
      PRO_DAILY_REQUEST_LIMIT: ${PRO_DAILY_REQUEST_LIMIT:-0}
      PRO_DAILY_INDEX_BYTES_LIMIT: ${PRO_DAILY_INDEX_BYTES_LIMIT:-0}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:-}
      MCP_MAX_SESSIONS: ${MCP_MAX_SESSIONS:-1000}
      MCP_MAX_SESSIONS_PER_USER: ${MCP_MAX_SESSIONS_PER_USER:-16}
      INDEX_JOB_HEARTBEAT_TIMEOUT: ${INDEX_JOB_HEARTBEAT_TIMEOUT:-10m}
      INDEX_JOB_SWEEP_INTERVAL: ${INDEX_JOB_SWEEP_INTERVAL:-1m}
      INDEX_JOB_RENEW_TIMEOUT: ${INDEX_JOB_RENEW_TIMEOUT:-15s}
      INDEX_MAX_MANIFEST_FILES: ${INDEX_MAX_MANIFEST_FILES:-100000}
      INDEX_MAX_BATCH_FILES: ${INDEX_MAX_BATCH_FILES:-50}
      INDEX_MAX_FILE_BYTES: ${INDEX_MAX_FILE_BYTES:-524288}
      INDEX_MAX_BATCH_BYTES: ${INDEX_MAX_BATCH_BYTES:-524288}
      INDEX_MAX_PATH_BYTES: ${INDEX_MAX_PATH_BYTES:-4096}
      INDEX_MAX_FAILURE_BYTES: ${INDEX_MAX_FAILURE_BYTES:-2000}
      INDEX_START_MIN_INTERVAL: ${INDEX_START_MIN_INTERVAL:-30s}
      INDEX_START_MEMORY_ENTRIES: ${INDEX_START_MEMORY_ENTRIES:-4096}
      MCP_CLIENT_REQUEST_BODY_LIMIT_BYTES: ${MCP_CLIENT_REQUEST_BODY_LIMIT_BYTES:-33554432}
      LCE_MCP_REQUEST_BODY_LIMIT_BYTES: ${LCE_MCP_REQUEST_BODY_LIMIT_BYTES:-4194304}
      MCP_CALL_TIMEOUT: ${MCP_CALL_TIMEOUT:-120s}
      INDEX_MCP_CALL_TIMEOUT: ${INDEX_MCP_CALL_TIMEOUT:-330s}
      MCP_INIT_SESSION_TIMEOUT: ${MCP_INIT_SESSION_TIMEOUT:-10s}
      PLATFORM_MODEL_CONFIG_BODY_LIMIT_BYTES: ${PLATFORM_MODEL_CONFIG_BODY_LIMIT_BYTES:-65536}
      PLATFORM_MODEL_CONFIG_READ_TIMEOUT: ${PLATFORM_MODEL_CONFIG_READ_TIMEOUT:-15s}
      PLATFORM_MODEL_DISCOVERY_TIMEOUT: ${PLATFORM_MODEL_DISCOVERY_TIMEOUT:-30s}
      PLATFORM_MODEL_CONFIG_VALIDATION_TIMEOUT: ${PLATFORM_MODEL_CONFIG_VALIDATION_TIMEOUT:-35s}
      PLATFORM_MODEL_CONFIG_BARRIER_WAIT: ${PLATFORM_MODEL_CONFIG_BARRIER_WAIT:-10s}
      PLATFORM_MODEL_CONFIG_CLEAR_TIMEOUT: ${PLATFORM_MODEL_CONFIG_CLEAR_TIMEOUT:-30s}
      PLATFORM_MODEL_CONFIG_SAVE_TIMEOUT: ${PLATFORM_MODEL_CONFIG_SAVE_TIMEOUT:-15s}
      PLATFORM_MODEL_CONFIG_RESET_SAVE_TIMEOUT: ${PLATFORM_MODEL_CONFIG_RESET_SAVE_TIMEOUT:-60s}
      PLATFORM_MODEL_CONFIG_LOCK_POLL_INTERVAL: ${PLATFORM_MODEL_CONFIG_LOCK_POLL_INTERVAL:-50ms}
      LEADERBOARD_UPDATE_INTERVAL: ${LEADERBOARD_UPDATE_INTERVAL:-30m}
      LEADERBOARD_TOP_N: ${LEADERBOARD_TOP_N:-10}
      LEADERBOARD_TIMEZONE: ${LEADERBOARD_TIMEZONE:-Asia/Shanghai}
      HEALTH_CHECK_INTERVAL: ${HEALTH_CHECK_INTERVAL:-2m}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-30s}
      MCP_HTTP_IDLE_CONN_TIMEOUT: ${MCP_HTTP_IDLE_CONN_TIMEOUT:-90s}
      MCP_HTTP_MAX_IDLE_CONNS: ${MCP_HTTP_MAX_IDLE_CONNS:-50}
      MCP_HTTP_MAX_IDLE_CONNS_PER_HOST: ${MCP_HTTP_MAX_IDLE_CONNS_PER_HOST:-50}
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-30m}
      MCP_SESSION_SWEEP_INTERVAL: ${MCP_SESSION_SWEEP_INTERVAL:-1m}
      MCP_TOOLS_CACHE_TTL: ${MCP_TOOLS_CACHE_TTL:-5m}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-40}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-40}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
      AUTH_CACHE_POSITIVE_TTL: ${AUTH_CACHE_POSITIVE_TTL:-30s}
      AUTH_CACHE_NEGATIVE_TTL: ${AUTH_CACHE_NEGATIVE_TTL:-5s}
      AUTH_CACHE_MAX_ENTRIES: ${AUTH_CACHE_MAX_ENTRIES:-10000}
      MODEL_CONFIG_CACHE_TTL: ${MODEL_CONFIG_CACHE_TTL:-5m}
      QUOTA_CACHE_TTL: ${QUOTA_CACHE_TTL:-5m}
      QUOTA_COUNTER_TTL: ${QUOTA_COUNTER_TTL:-48h}
      REQUEST_LOG_STALE_AFTER: ${REQUEST_LOG_STALE_AFTER:-15m}
      REQUEST_LOG_RECONCILE_INTERVAL: ${REQUEST_LOG_RECONCILE_INTERVAL:-5m}
      CLEAR_INDEX_COOLDOWN: ${CLEAR_INDEX_COOLDOWN:-72h}
      DELETE_ROOT_MIN_INTERVAL: ${DELETE_ROOT_MIN_INTERVAL:-1m}
      DELETE_ROOT_MEMORY_ENTRIES: ${DELETE_ROOT_MEMORY_ENTRIES:-4096}
      INDEX_OPERATION_LEASE_DURATION: ${INDEX_OPERATION_LEASE_DURATION:-2m}
      INDEX_OPERATION_RENEW_INTERVAL: ${INDEX_OPERATION_RENEW_INTERVAL:-30s}
      INDEX_OPERATION_ACQUIRE_POLL_INTERVAL: ${INDEX_OPERATION_ACQUIRE_POLL_INTERVAL:-100ms}
      INDEX_OPERATION_DB_TIMEOUT: ${INDEX_OPERATION_DB_TIMEOUT:-5s}

  frontend:
    build:
      context: ${DEPLOY_FRONTEND_DIR:-../../acemcp-relay-frontend}
      args:
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}"
        NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER: "${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER:?set NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER in .env}"
        NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER_ARGS: "${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER_ARGS:-[]}"
        NEXT_PUBLIC_LCE_CLIENT_PACKAGE_NAME: "${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_NAME:-@anmezing/lce-cloud}"
        NEXT_PUBLIC_LCE_CLIENT_PACKAGE_TAG: "${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_TAG:-latest}"
        NEXT_PUBLIC_LCE_CLIENT_GLOBAL_EXECUTABLE: "${NEXT_PUBLIC_LCE_CLIENT_GLOBAL_EXECUTABLE:-}"
        NEXT_PUBLIC_APPLICATION_TIMEZONE: "${NEXT_PUBLIC_APPLICATION_TIMEZONE:-${APPLICATION_TIMEZONE:-Asia/Shanghai}}"
        NEXT_PUBLIC_INDEX_POLL_ACTIVE_MS: "${NEXT_PUBLIC_INDEX_POLL_ACTIVE_MS:-5000}"
        NEXT_PUBLIC_INDEX_POLL_IDLE_MS: "${NEXT_PUBLIC_INDEX_POLL_IDLE_MS:-30000}"
        NEXT_PUBLIC_LOGS_AUTO_REFRESH_MS: "${NEXT_PUBLIC_LOGS_AUTO_REFRESH_MS:-5000}"
        NEXT_PUBLIC_LOGS_PAGE_SIZE: "${NEXT_PUBLIC_LOGS_PAGE_SIZE:-20}"
        NEXT_PUBLIC_LEADERBOARD_REFRESH_MS: "${NEXT_PUBLIC_LEADERBOARD_REFRESH_MS:-30000}"
        NEXT_PUBLIC_LEADERBOARD_DATE_OPTION_COUNT: "${NEXT_PUBLIC_LEADERBOARD_DATE_OPTION_COUNT:-3}"
        NEXT_PUBLIC_PAYMENT_STATUS_POLL_MS: "${NEXT_PUBLIC_PAYMENT_STATUS_POLL_MS:-2000}"
        NEXT_PUBLIC_HEALTH_HISTORY_LIMIT: "${NEXT_PUBLIC_HEALTH_HISTORY_LIMIT:-60}"
        NEXT_PUBLIC_HEALTH_LATEST_LIMIT: "${NEXT_PUBLIC_HEALTH_LATEST_LIMIT:-1}"
        NEXT_PUBLIC_HEALTH_RESULT_POLL_MS: "${NEXT_PUBLIC_HEALTH_RESULT_POLL_MS:-5000}"
        NEXT_PUBLIC_HEALTH_RESULT_POLL_ATTEMPTS: "${NEXT_PUBLIC_HEALTH_RESULT_POLL_ATTEMPTS:-12}"
        NEXT_PUBLIC_HEALTH_COUNTDOWN_TICK_MS: "${NEXT_PUBLIC_HEALTH_COUNTDOWN_TICK_MS:-1000}"
        NEXT_PUBLIC_HEALTH_SLOW_THRESHOLD_MS: "${NEXT_PUBLIC_HEALTH_SLOW_THRESHOLD_MS:-5000}"
        NEXT_PUBLIC_HOVER_INTENT_MS: "${NEXT_PUBLIC_HOVER_INTENT_MS:-120}"
        NEXT_PUBLIC_NOTICE_DURATION_MS: "${NEXT_PUBLIC_NOTICE_DURATION_MS:-2000}"
        NEXT_PUBLIC_INVITATION_REDIRECT_MS: "${NEXT_PUBLIC_INVITATION_REDIRECT_MS:-1200}"
        NEXT_PUBLIC_MINIMUM_LOADING_FEEDBACK_MS: "${NEXT_PUBLIC_MINIMUM_LOADING_FEEDBACK_MS:-300}"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3001"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_TRUSTED_PROXIES: ${BETTER_AUTH_TRUSTED_PROXIES:-}
      AUTH_LINUXDO_ID: ${AUTH_LINUXDO_ID:-}
      AUTH_LINUXDO_SECRET: ${AUTH_LINUXDO_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GITHUB_MIN_ACCOUNT_AGE_DAYS: ${AUTH_GITHUB_MIN_ACCOUNT_AGE_DAYS:-365}
      AUTH_MIN_PASSWORD_LENGTH: ${AUTH_MIN_PASSWORD_LENGTH:-8}
      AUTH_MAX_PASSWORD_LENGTH: ${AUTH_MAX_PASSWORD_LENGTH:-128}
      AUTH_EMAIL_VERIFICATION_TTL_SECONDS: ${AUTH_EMAIL_VERIFICATION_TTL_SECONDS:-3600}
      AUTH_ORGANIZATION_INVITATION_TTL_SECONDS: ${AUTH_ORGANIZATION_INVITATION_TTL_SECONDS:-172800}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_MAX_CONNECTIONS: ${SMTP_MAX_CONNECTIONS:-3}
      SMTP_MAX_MESSAGES: ${SMTP_MAX_MESSAGES:-100}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-20000}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-acemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acemcp_relay}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEFAULT_DAILY_REQUEST_LIMIT: ${DEFAULT_DAILY_REQUEST_LIMIT:-0}
      DAILY_INDEX_BYTES_LIMIT: ${DAILY_INDEX_BYTES_LIMIT:-2147483648}
      PRO_DAILY_REQUEST_LIMIT: ${PRO_DAILY_REQUEST_LIMIT:-0}
      PRO_DAILY_INDEX_BYTES_LIMIT: ${PRO_DAILY_INDEX_BYTES_LIMIT:-0}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:-}
      LCE_RELAY_URL: ${LCE_RELAY_URL:-http://relay:3009}
      LCE_RELAY_REQUEST_TIMEOUT_MS: ${LCE_RELAY_REQUEST_TIMEOUT_MS:-15000}
      LCE_MODEL_CONFIG_SAVE_PROXY_TIMEOUT_MS: ${LCE_MODEL_CONFIG_SAVE_PROXY_TIMEOUT_MS:-140000}
      LCE_MODEL_DISCOVERY_PROXY_TIMEOUT_MS: ${LCE_MODEL_DISCOVERY_PROXY_TIMEOUT_MS:-30000}
      LCE_PLATFORM_MODEL_CONFIG_BODY_LIMIT_BYTES: ${LCE_PLATFORM_MODEL_CONFIG_BODY_LIMIT_BYTES:-65536}
      LCE_PLATFORM_MODEL_CONFIG_RESPONSE_LIMIT_BYTES: ${LCE_PLATFORM_MODEL_CONFIG_RESPONSE_LIMIT_BYTES:-65536}
      LCE_PROVIDER_MODEL_DISCOVERY_RESPONSE_LIMIT_BYTES: ${LCE_PROVIDER_MODEL_DISCOVERY_RESPONSE_LIMIT_BYTES:-1048576}
      APPLICATION_TIMEZONE: ${APPLICATION_TIMEZONE:-Asia/Shanghai}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
      LCE_PACKAGE_REGISTRY_URL: ${LCE_PACKAGE_REGISTRY_URL:-https://registry.npmjs.org}
      NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER: ${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER:-}
      NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER_ARGS: ${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_RUNNER_ARGS:-[]}
      NEXT_PUBLIC_LCE_CLIENT_PACKAGE_NAME: ${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_NAME:-@anmezing/lce-cloud}
      NEXT_PUBLIC_LCE_CLIENT_PACKAGE_TAG: ${NEXT_PUBLIC_LCE_CLIENT_PACKAGE_TAG:-latest}
      NEXT_PUBLIC_LCE_CLIENT_GLOBAL_EXECUTABLE: ${NEXT_PUBLIC_LCE_CLIENT_GLOBAL_EXECUTABLE:-}
      NEXT_PUBLIC_APPLICATION_TIMEZONE: ${NEXT_PUBLIC_APPLICATION_TIMEZONE:-${APPLICATION_TIMEZONE:-Asia/Shanghai}}
      LCE_CLIENT_VERSION_CACHE_SECONDS: ${LCE_CLIENT_VERSION_CACHE_SECONDS:-900}
      LCE_MODEL_DISCOVERY_RESULT_LIMIT: ${LCE_MODEL_DISCOVERY_RESULT_LIMIT:-500}
      LCE_ADMIN_LOG_PAGE_SIZE: ${LCE_ADMIN_LOG_PAGE_SIZE:-50}
      NEXT_PUBLIC_INDEX_POLL_ACTIVE_MS: ${NEXT_PUBLIC_INDEX_POLL_ACTIVE_MS:-5000}
      NEXT_PUBLIC_INDEX_POLL_IDLE_MS: ${NEXT_PUBLIC_INDEX_POLL_IDLE_MS:-30000}
      NEXT_PUBLIC_LOGS_AUTO_REFRESH_MS: ${NEXT_PUBLIC_LOGS_AUTO_REFRESH_MS:-5000}
      NEXT_PUBLIC_LOGS_PAGE_SIZE: ${NEXT_PUBLIC_LOGS_PAGE_SIZE:-20}
      NEXT_PUBLIC_LEADERBOARD_REFRESH_MS: ${NEXT_PUBLIC_LEADERBOARD_REFRESH_MS:-30000}

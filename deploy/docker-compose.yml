services:
  lce:
    build: ../../lce
    container_name: lce
    restart: unless-stopped
    volumes:
      - lce_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LCE_HOME: /data
      LCE_CLOUD_DATABASE_URL: ${LCE_CLOUD_DATABASE_URL:?set a PostgreSQL URL whose server has pgvector installed}
      LCE_TENANT_ASSERTION_SECRET: ${LCE_TENANT_ASSERTION_SECRET:?set LCE_TENANT_ASSERTION_SECRET in .env (>=32 chars, shared with relay)}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-1024}
      EMBEDDINGS_OUTPUT_DIMENSION: ${EMBEDDINGS_OUTPUT_DIMENSION:-}
      EMBEDDINGS_OUTPUT_DTYPE: ${EMBEDDINGS_OUTPUT_DTYPE:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      QUERY_REWRITE_API_KEY: ${QUERY_REWRITE_API_KEY:-}
      QUERY_REWRITE_BASE_URL: ${QUERY_REWRITE_BASE_URL:-}
      QUERY_REWRITE_MODEL: ${QUERY_REWRITE_MODEL:-}
      QUERY_REWRITE_MAX_QUERIES: ${QUERY_REWRITE_MAX_QUERIES:-3}
      QUERY_REWRITE_TIMEOUT_MS: ${QUERY_REWRITE_TIMEOUT_MS:-4000}
      LCE_HTTP_MAX_CONCURRENT_REQUESTS: ${LCE_HTTP_MAX_CONCURRENT_REQUESTS:-16}
      LCE_HTTP_MAX_SESSIONS: ${LCE_HTTP_MAX_SESSIONS:-16}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/mcp/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  relay:
    build: ../
    container_name: relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3009"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      lce:
        condition: service_healthy
    environment:
      GIN_MODE: release
      SERVER_ADDR: "0.0.0.0:3009"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LCE_MCP_URL: http://lce:3000/mcp
      LCE_TENANT_ASSERTION_SECRET: ${LCE_TENANT_ASSERTION_SECRET:?set LCE_TENANT_ASSERTION_SECRET in .env (>=32 chars, shared with lce)}
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-acemcp}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-acemcp_relay}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-}
      LATEST_CLIENT_VERSION: ${LATEST_CLIENT_VERSION:-}
      CONSOLE_API_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BANNED_CACHE_TTL: ${BANNED_CACHE_TTL:-5m}
      DEFAULT_DAILY_REQUEST_LIMIT: ${DEFAULT_DAILY_REQUEST_LIMIT:-0}
      DAILY_INDEX_BYTES_LIMIT: ${DAILY_INDEX_BYTES_LIMIT:-2147483648}
      PRO_DAILY_REQUEST_LIMIT: ${PRO_DAILY_REQUEST_LIMIT:-0}
      PRO_DAILY_INDEX_BYTES_LIMIT: ${PRO_DAILY_INDEX_BYTES_LIMIT:-0}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:-}
      MCP_MAX_SESSIONS: ${MCP_MAX_SESSIONS:-1000}
      MCP_MAX_SESSIONS_PER_USER: ${MCP_MAX_SESSIONS_PER_USER:-16}

  frontend:
    build: ../../acemcp-relay-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3001"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://lcebot.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_TRUSTED_PROXIES: ${BETTER_AUTH_TRUSTED_PROXIES:-}
      AUTH_LINUXDO_ID: ${AUTH_LINUXDO_ID:-}
      AUTH_LINUXDO_SECRET: ${AUTH_LINUXDO_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GITHUB_MIN_ACCOUNT_AGE_DAYS: ${AUTH_GITHUB_MIN_ACCOUNT_AGE_DAYS:-365}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-acemcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acemcp_relay}
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DEFAULT_DAILY_REQUEST_LIMIT: ${DEFAULT_DAILY_REQUEST_LIMIT:-0}
      DAILY_INDEX_BYTES_LIMIT: ${DAILY_INDEX_BYTES_LIMIT:-2147483648}
      PRO_DAILY_REQUEST_LIMIT: ${PRO_DAILY_REQUEST_LIMIT:-0}
      PRO_DAILY_INDEX_BYTES_LIMIT: ${PRO_DAILY_INDEX_BYTES_LIMIT:-0}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      MODEL_CONFIG_SECRET: ${MODEL_CONFIG_SECRET:-}
      PAYMENT_NOTIFY_BASE_URL: ${PAYMENT_NOTIFY_BASE_URL:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_KEY_TYPE: ${ALIPAY_KEY_TYPE:-PKCS1}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_ENDPOINT: ${ALIPAY_ENDPOINT:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_PUBLIC_KEY: ${WECHAT_PAY_PUBLIC_KEY:-}
      WECHAT_PAY_API_BASE_URL: ${WECHAT_PAY_API_BASE_URL:-https://api.mch.weixin.qq.com}

volumes:
  lce_data:
